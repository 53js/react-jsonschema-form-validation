# Javascript Node CircleCI 2.1 configuration file
#
# Check https://circleci.com/docs/2.0/language-javascript/ for more details

version: 2.1

executors:
  node20:
    docker:
      # Node 20 LTS — TS 6 requires Node ≥18, and the deprecated
      # `circleci/node:latest` image is frozen around Node 14/16.
      - image: cimg/node:20.20
    working_directory: ~/repo

jobs:
  build:
    executor: node20
    steps:
      - checkout

      # Download and cache dependencies (keyed on yarn.lock for reproducibility)
      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "yarn.lock" }}
            - v2-dependencies-

      - run: yarn install --frozen-lockfile --ignore-optional --ignore-scripts

      - save_cache:
          paths:
            - node_modules
          key: v2-dependencies-{{ checksum "yarn.lock" }}

      - run:
          name: Setup Code Climate test-reporter
          command: |
            # download test reporter as a static binary
            curl -L https://codeclimate.com/downloads/test-reporter/test-reporter-latest-linux-amd64 > ./cc-test-reporter
            chmod +x ./cc-test-reporter
            # notify Code Climate of a pending test report using `before-build`
            ./cc-test-reporter before-build

      - run:
          name: Type check
          command: yarn type-check

      - run:
          name: Run tests
          command: yarn test:runtime --coverage

      - run:
          name: Build
          command: |
            # build library!
            yarn dist
            # upload test report to Code Climate using `after-build`
            ./cc-test-reporter after-build -t lcov

  # One job per @types/react major. Each installs the parent lib from a
  # fresh tarball into `test-types/node_modules` (setup.sh), overrides
  # @types/react to the matrix's version, and runs `tsc --noEmit` on
  # positive.tsx + negative.tsx.
  types:
    executor: node20
    parameters:
      react:
        type: string
    steps:
      - checkout
      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "yarn.lock" }}
      - run: yarn install --frozen-lockfile --ignore-optional --ignore-scripts
      - run: yarn dist:js && yarn dist:types
      - run: bash test-types/setup.sh
      - run:
          name: Type-check against @types/react@^<< parameters.react >>
          command: |
            cd test-types
            yarn add --dev --silent "@types/react@^<< parameters.react >>"
            yarn test

workflows:
  ci:
    jobs:
      - build
      - types:
          matrix:
            parameters:
              react: ["16", "17", "18", "19"]
